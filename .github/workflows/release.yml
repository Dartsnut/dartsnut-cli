name: Release installer

on:
  push:
    tags:
      - 'installer-v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dartsnut-rpi-installer-x86_64-unknown-linux-gnu
            cross: false
            windows: false
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: dartsnut-rpi-installer-aarch64-unknown-linux-gnu
            cross: true
            windows: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: dartsnut-rpi-installer-x86_64-apple-darwin
            cross: false
            windows: false
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: dartsnut-rpi-installer-aarch64-apple-darwin
            cross: false
            windows: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dartsnut-rpi-installer-x86_64-pc-windows-msvc.exe
            cross: false
            windows: true
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: dartsnut-rpi-installer-aarch64-pc-windows-msvc.exe
            cross: false
            windows: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build aarch64 Linux with cross
        if: matrix.cross
        run: |
          cargo install cross --locked
          cross build --locked --release --target "${{ matrix.target }}"
        shell: bash

      - name: Build target natively
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target "${{ matrix.target }}"
        shell: bash

      - name: Run full Linux regression suite
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked
        shell: bash
      - name: Name Windows asset
        if: matrix.windows
        run: Copy-Item -LiteralPath 'target/${{ matrix.target }}/release/dartsnut-rpi-installer.exe' -Destination '${{ matrix.asset }}'
        shell: pwsh

      - name: Name Unix asset
        if: ${{ !matrix.windows }}
        run: cp "target/${{ matrix.target }}/release/dartsnut-rpi-installer" "${{ matrix.asset }}"
        shell: bash

      - name: Run native release binary
        if: ${{ !matrix.cross }}
        run: "./${{ matrix.asset }} --version"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dartsnut-rpi-installer-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum \
            dartsnut-rpi-installer-x86_64-unknown-linux-gnu \
            dartsnut-rpi-installer-aarch64-unknown-linux-gnu \
            dartsnut-rpi-installer-x86_64-apple-darwin \
            dartsnut-rpi-installer-aarch64-apple-darwin \
            dartsnut-rpi-installer-x86_64-pc-windows-msvc.exe \
            dartsnut-rpi-installer-aarch64-pc-windows-msvc.exe \
            > SHA256SUMS
        shell: bash

      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          state=$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null) || state=absent
          if [ "$state" = false ]; then
            echo "Release $tag is already published"
            exit 0
          fi
          if [ "$state" = absent ]; then
            gh release create "$tag" --repo "$repo" --verify-tag --draft --title "$tag"
          fi
          gh release upload "$tag" dist/* --repo "$repo" --clobber
          mkdir verify
          gh release download "$tag" --repo "$repo" --dir verify
          (cd verify && sha256sum --check SHA256SUMS)
          gh release edit "$tag" --repo "$repo" --draft=false --latest
